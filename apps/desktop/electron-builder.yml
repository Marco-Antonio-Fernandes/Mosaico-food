appId: br.com.mosaico.food
productName: Mosaico Food
executableName: mosaico-food
icon: electron/assets/mosaico-food.png
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
extraResources:
  - from: ../../local-backend/dist
    to: backend/dist
  - from: ../../local-backend/package.json
    to: backend/package.json
  - from: ../../local-backend/node_modules
    to: backend/node_modules
  - from: ../../local-backend/prisma
    to: backend/prisma
  - from: electron/speech-runtime
    to: speech
  - from: electron/interpreter-runtime
    to: interpreter
linux:
  target:
    - AppImage
    - deb
  category: Utility
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
